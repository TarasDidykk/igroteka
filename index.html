<style>
/* Layout: a kid's room at night — cartridges stand on wooden shelves, an 8-bit console is docked at the bottom, a CRT pops up when a cartridge goes in. Single dark look by choice. */
:root{
  --wall:#221B35; --wall2:#2A2241; --wood:#8A5A33; --wood-hi:#B07A48; --wood-d:#4F2E17;
  --ink:#F4EEDF; --muted:#B4A9CC; --label:#F3E9D2; --label-ink:#1E1730;
  --accent:#FFC83D; --accent-ink:#2A1A00; --red:#E2392F; --card:#2F2649; --edge:#130E20; --field:#1A1429;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{background:var(--wall);color:var(--ink);font:400 16px/1.55 var(--body);
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.025) 46px 48px),radial-gradient(ellipse at 50% -10%,#3A2E5C 0,transparent 60%)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px calc(190px + env(safe-area-inset-bottom,0px));display:grid;gap:44px}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
button{font-family:inherit}

/* header */
.top{display:grid;gap:18px}
.eyebrow{font:400 .62rem/1.6 var(--pixel);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .tag{background:var(--accent);color:var(--accent-ink);padding:6px 8px}
h1{font:400 clamp(1.5rem,5vw,3rem)/1.25 var(--pixel);color:var(--ink);text-shadow:4px 4px 0 var(--red)}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch;margin:0}
.lead b{color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font:400 .62rem/1.6 var(--pixel);color:var(--muted)}
.stats b{color:var(--accent);font-weight:400}

/* roster */
.roster{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--muted);background:transparent;color:var(--ink);
  font:600 .95rem/1 var(--body);padding:9px 12px 9px 10px;border-radius:999px;cursor:pointer}
.chip .sw{width:14px;height:14px;border-radius:3px;background:var(--c,var(--ink))}
.chip .n{font:400 .6rem/1 var(--pixel);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--wall)}
.chip[aria-pressed="true"] .n{color:var(--wall)}

/* shelf: each cell carries its own plank; zero column gap joins them into one board per row */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));column-gap:0;row-gap:34px}
.cell{position:relative;padding:0 14px 22px;display:grid;justify-items:center;align-content:end;min-width:0}
.cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(var(--wood-hi) 0 3px,var(--wood) 3px 11px,var(--wood-d) 11px)}
.cell::before{content:"";position:absolute;left:8%;right:8%;bottom:-10px;height:10px;background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,.45),transparent 70%)}

.cart{--c:#E2392F;position:relative;width:100%;max-width:240px;aspect-ratio:1.3;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));transition:transform .18s ease,opacity .2s}
@media (hover:hover){.cart:hover{transform:translateY(-6px) rotate(-1deg)}}
.cart:active{cursor:grabbing}
.shell{position:absolute;inset:0;background:var(--c);
  clip-path:polygon(0 9%,5% 0,95% 0,100% 9%,100% 100%,0 100%);
  box-shadow:inset 4px 4px 0 rgba(255,255,255,.28),inset -5px -6px 0 rgba(0,0,0,.28)}
.ribs{position:absolute;left:9%;right:9%;top:4%;height:13%;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}
.grip{position:absolute;top:22%;bottom:8%;width:4%;background:repeating-linear-gradient(180deg,rgba(0,0,0,.25) 0 3px,transparent 3px 7px)}
.grip.l{left:2.5%}.grip.r{right:2.5%}
.sticker{position:absolute;left:10%;right:10%;top:21%;bottom:9%;background:var(--label);color:var(--label-ink);border-radius:3px;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.sticker .band{background:var(--label-ink);color:var(--label);font:400 .42rem/1 var(--pixel);letter-spacing:.08em;padding:4px 6px;display:flex;justify-content:space-between;gap:6px}
.sticker canvas{display:block;width:100%;height:100%;min-height:0;object-fit:cover;image-rendering:pixelated}
.sticker .cov{display:block;width:100%;height:100%;min-height:0;object-fit:cover}
.tools{position:absolute;left:-6px;top:-8px;z-index:3;display:flex;gap:4px}
.tools .del{position:static}
.tools .pic{height:28px;padding:0 10px;border-radius:14px;border:2px solid var(--wall);background:var(--accent);color:var(--accent-ink);font:700 .75rem/1 var(--body);cursor:pointer}
.tools .pic.no{background:var(--ink);color:var(--wall)}
.prev{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.prev img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:2px solid var(--edge)}
.sticker .ttl{font:400 .56rem/1.45 var(--pixel);padding:5px 6px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sticker .who{font:700 .72rem/1 var(--body);padding:0 6px 6px;display:flex;align-items:center;gap:5px}
.sticker .who i{width:8px;height:8px;background:var(--c);display:inline-block}
.tagx{position:absolute;right:4%;bottom:12%;z-index:2;font:400 .42rem/1 var(--pixel);padding:5px 6px;transform:rotate(6deg);background:var(--ink);color:var(--wall)}
.tagx.wip{background:var(--accent);color:var(--accent-ink)}
.meta{margin-top:10px;font-size:.82rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.cart.out{opacity:.18;cursor:default;transform:none}
.cart.out::after{content:"у приставці";position:absolute;inset:0;display:grid;place-items:center;font:400 .55rem/1 var(--pixel);color:var(--ink)}
.cart.lifted{opacity:.15}
.del{position:absolute;left:-6px;top:-6px;z-index:3;width:28px;height:28px;border-radius:50%;border:2px solid var(--wall);background:var(--red);color:#fff;font:700 1rem/1 var(--body);cursor:pointer}

.empty{border:2px dashed var(--muted);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted)}

/* info + teacher */
.info{max-width:720px}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:22px;display:grid;gap:14px;min-width:0}
.panel h2{font:400 .8rem/1.5 var(--pixel);color:var(--accent)}
.panel p{margin:0}
.muted{color:var(--muted)}
.teach{border-color:var(--accent)}
.teach summary{cursor:pointer;font:400 .75rem/1.5 var(--pixel);color:var(--accent);list-style:none}
.teach summary::-webkit-details-marker{display:none}
.teach summary::after{content:" +"}
.teach[open] summary::after{content:" –"}
form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:5px;font:600 .82rem/1.2 var(--body);color:var(--muted)}
input,select,textarea{font:400 1rem/1.4 var(--body);color:var(--ink);background:var(--field);border:1.5px solid var(--edge);border-radius:7px;padding:9px 10px;width:100%;box-sizing:border-box;min-width:0}
textarea{resize:vertical;min-height:64px}
.err{color:#FF8A80;font-weight:600;font-size:.9rem;margin:0}
.st-row{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center}
.st-row input[type=color]{padding:2px;height:40px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:400 .7rem/1.2 var(--pixel);text-decoration:none;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:13px 16px;box-shadow:0 4px 0 #A9761A}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A9761A}
.ghost{font:600 .85rem/1 var(--body);background:transparent;color:var(--muted);border:1.5px solid var(--muted);border-radius:6px;padding:8px 10px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.savebar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--ink);color:var(--wall);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:600}
.savebar .ghost{color:var(--wall);border-color:var(--wall)}
.mode{background:var(--red);color:#fff;padding:6px 8px}
footer{font:400 .55rem/1.8 var(--pixel);color:var(--muted)}

/* console dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;display:flex;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(10,7,18,.85) 55%)}
.console{pointer-events:auto;position:relative;width:min(460px,100%);margin-top:62px;user-select:none;-webkit-user-select:none}
.deckTop{height:34px;background:linear-gradient(#55525E,#3E3B47);border-radius:14px 14px 0 0;position:relative;box-shadow:inset 0 3px 0 rgba(255,255,255,.18)}
.slot{position:absolute;left:50%;top:9px;width:200px;height:16px;transform:translateX(-50%);background:#0B0910;border-radius:3px;
  box-shadow:inset 0 3px 4px #000,0 1px 0 rgba(255,255,255,.15);transition:box-shadow .15s}
.slot::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-5px;height:9px;background:linear-gradient(#4A4753,#3E3B47);border-radius:0 0 3px 3px;z-index:3}
.console.hot .slot{box-shadow:inset 0 3px 4px #000,0 0 0 3px var(--accent),0 0 24px 6px rgba(255,200,61,.55)}
.incart{position:absolute;left:50%;bottom:4px;width:170px;height:70px;margin-left:-85px;z-index:2;background:var(--c);
  clip-path:polygon(0 12%,5% 0,95% 0,100% 12%,100% 100%,0 100%);box-shadow:inset 3px 3px 0 rgba(255,255,255,.28),inset -4px 0 0 rgba(0,0,0,.25);
  transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.incart::before{content:"";position:absolute;left:9%;right:9%;top:6%;height:18%;background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}
.incart span{position:absolute;left:10%;right:10%;top:32%;bottom:0;background:var(--label);color:var(--label-ink);font:400 .45rem/1.5 var(--pixel);padding:5px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:2px 2px 0 0}
.incart.up{transform:translateY(-120%)}
.hint{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;font:400 .55rem/1 var(--pixel);color:var(--accent);
  animation:bob 1.4s ease-in-out infinite}
.hint::after{content:"▼";display:block;text-align:center;margin-top:6px}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.face{background:linear-gradient(#2D2B33,#1C1B21);border-radius:0 0 8px 8px;padding:12px 16px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 -1px 0 #111}
.brand{font:400 .7rem/1 var(--pixel);color:#ECE7DA;display:grid;gap:6px}
.brand small{font-size:.42rem;color:var(--red)}
.stripe{flex:1;height:8px;background:linear-gradient(90deg,var(--red) 0 60%,var(--accent) 60% 75%,transparent 75%);opacity:.9;min-width:20px}
.cbtns{display:flex;gap:8px}
.cbtn{display:grid;justify-items:center;gap:5px;background:none;border:0;color:#B9B4C4;font:400 .4rem/1 var(--pixel);cursor:pointer;padding:2px}
.cbtn b{display:block;width:34px;height:16px;border-radius:3px;background:linear-gradient(#77737F,#55525D);box-shadow:0 3px 0 #111}
.cbtn:active b{transform:translateY(2px);box-shadow:0 1px 0 #111}
.cbtn#pwr b{background:linear-gradient(#E85A50,#B4271F)}
.led{position:absolute;left:18px;top:13px;width:8px;height:8px;border-radius:50%;background:#3A1512;box-shadow:inset 0 1px 1px #000}
.led.on{background:#FF4A3D;box-shadow:0 0 8px 2px rgba(255,74,61,.8)}
.ports{position:absolute;right:18px;top:11px;display:flex;gap:8px}
.ports i{width:22px;height:11px;border-radius:2px;background:#16151A;box-shadow:inset 0 2px 2px #000}

/* drag ghost */
.ghostcart{position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;transform-origin:0 0;filter:drop-shadow(0 18px 18px rgba(0,0,0,.5))}
.ghostcart .cart{transition:none;transform:none!important;width:100%;max-width:none}
.flying{transition:transform .38s cubic-bezier(.5,0,.3,1),opacity .2s .3s}

/* TV */
.tv-wrap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,5,16,.72);backdrop-filter:blur(3px);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.tv{width:min(640px,100%);background:linear-gradient(#5B4A3A,#3C2F24);border-radius:22px;padding:18px 18px 12px;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.15);
  animation:tvIn .25s ease-out}
@keyframes tvIn{from{transform:scale(.92);opacity:0}}
.screen{position:relative;background:#0E1240;border-radius:28px/22px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.9),0 0 0 6px #1A140F;min-height:200px}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);border-radius:inherit}
.osd{display:grid;gap:12px;padding:20px 22px 22px;color:#F4F1E6;text-align:center}
.osd canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;border-radius:6px;display:block;max-width:100%}
.osd .cov{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;max-width:100%}
.osd h3{font:400 clamp(.8rem,3.2vw,1.2rem)/1.5 var(--pixel);color:var(--accent);text-shadow:3px 3px 0 #000}
.osd .by{font:400 .55rem/1.6 var(--pixel);color:#C9C4F0}
.osd .about{margin:0 auto;max-width:48ch;font-size:.95rem;color:#E3E0F5}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:.85rem;color:#C9C4F0}
kbd{font:400 .5rem/1 var(--pixel);color:#16133A;background:#E8E4F8;border-radius:4px;padding:6px 7px;box-shadow:0 3px 0 #8D88B8}
.start{justify-self:center;font-size:.85rem;animation:blink 1.1s steps(2,start) infinite}
.start:hover,.start:focus-visible{animation:none}
@keyframes blink{to{opacity:.35}}
.note{font-size:.78rem;color:#9C97C6;margin:0}
.noise{position:absolute;inset:0;width:100%;height:100%;z-index:2;image-rendering:pixelated}
.tvbase{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 6px 2px;flex-wrap:wrap}
.tvbase .mk{font:400 .5rem/1 var(--pixel);color:#D8C7A8;letter-spacing:.1em}
.tvbase .ghost{color:#EADCC2;border-color:#8F7A60;font-size:.85rem}
.tvbase div{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:520px){
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}
  .cell{padding:0 8px 20px}
  .ports,.stripe{display:none}
  .face{padding:10px 12px 12px}
}
/* intro: CRT power-on, title letters drop, a pixel runner collects coins, then a stepped wipe reveals the shelf */
.intro{position:fixed;inset:0;z-index:100;background:#05040A;display:grid;place-items:center;cursor:pointer;overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.intro .crt{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#2A2470 0,#100C38 55%,#05040A 100%);transform-origin:50% 50%;
  animation:crtOn .55s cubic-bezier(.2,.8,.3,1) both}
.intro .crt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(6)}45%{transform:scale(1,.004);filter:brightness(6)}75%{transform:scale(1,1);filter:brightness(2)}100%{transform:none;filter:none}}
.splash{position:relative;display:grid;justify-items:center;gap:18px;text-align:center;max-width:900px}

<body>
<div id="app"></div>
<script>
(function(){
/* ===================== НАЛАШТУВАННЯ =====================
   Встав між лапками посилання на свою Google-таблицю.
   Доступ до таблиці: «Усі, хто має посилання» → «Читач».           */
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/1f4PzTyitKK3uxW4mmuXILBVLntgcL-n0OW_5T1Gj4RU/edit';
var GROUP_NAME = 'Ігротека GDevelop';
var GROUP_SUB  = 'Курс розробки ігор · IT-Простір';
/* ======================================================== */

var FALLBACK={students:[{name:'Володя',color:'зелений'},{name:'Максиміліан',color:'жовтий'},{name:'Марко',color:'синій'},{name:'Ярослав',color:'червоний'}],
games:[
 {title:'Змійка 2.0',author:'Володя',url:'https://gd.games',genre:'аркада',controls:'Стрілки, Пробіл',about:'Класична змійка з бонусами: золоте яблуко дає подвійні очки, а стіни на третьому рівні рухаються.',status:'приклад',version:'1.0',date:'24.10.2026'},
 {title:'Космічний втікач',author:'Максиміліан',url:'https://gd.games',genre:'шутер',controls:'A, D, Пробіл',about:'Корабель ухиляється від астероїдів і збирає паливо. Кожні 30 секунд швидкість зростає.',status:'приклад',version:'0.8',date:'31.10.2026'},
 {title:'Лабіринт привидів',author:'Марко',url:'https://gd.games',genre:'головоломка',controls:'Стрілки',about:'Знайди ключ і вийди з лабіринту, поки привиди не помітили. Три рівні.',status:'приклад',version:'0.5',date:'03.11.2026'},
 {title:'Ніндзя-стрибун',author:'Ярослав',url:'https://gd.games',genre:'платформер',controls:'Стрілки, W, Shift',about:'Платформер із подвійним стрибком. Поки готовий лише перший рівень.',status:'приклад',version:'0.2',date:'05.11.2026'}]};

var COLORS={'червоний':'#E8473B','зелений':'#22A06B','жовтий':'#E9A81C','синій':'#2E86DE','блакитний':'#4FB3E8','фіолетовий':'#8B5BD6','рожевий':'#D9487F','бірюзовий':'#1BA3B0','помаранчевий':'#F07C2B','оранжевий':'#F07C2B','коричневий':'#8A5A33','сірий':'#8A8798','білий':'#E8E4DA','чорний':'#3A3550',
  'red':'#E8473B','green':'#22A06B','yellow':'#E9A81C','blue':'#2E86DE','purple':'#8B5BD6','pink':'#D9487F','orange':'#F07C2B'};
var SPARE=['#22A06B','#E9A81C','#2E86DE','#E8473B','#8B5BD6','#D9487F','#1BA3B0','#F07C2B'];

var state={group:{name:GROUP_NAME,sub:GROUP_SUB},students:[],games:[]};
var status='loading', note='', filter='all', loaded=null;
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function key(s){return String(s||'').trim().toLowerCase();}
function stu(id){for(var i=0;i<state.students.length;i++)if(state.students[i].id===id)return state.students[i];return {id:id,name:id||'—',color:'#8896AB'};}
function game(id){for(var i=0;i<state.games.length;i++)if(state.games[i].id===id)return state.games[i];return null;}
function fmtDate(d){if(!d)return '';try{return new Intl.DateTimeFormat('uk-UA',{day:'numeric',month:'short'}).format(new Date(d+'T12:00:00'));}catch(e){return d;}}
function plural(n,a,b,c){var m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<12||h>14))return b;return c;}

/* ---------- reading the Google Sheet ---------- */
function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim()!=='';});});
}
function table(rows){
  if(!rows.length) return {h:[],rows:[]};
  var h=rows[0].map(function(x){return key(x).replace(/[’'ʼ`]/g,'');});
  return {h:h,rows:rows.slice(1)};
}
function col(t,names){for(var i=0;i<t.h.length;i++)for(var j=0;j<names.length;j++)if(t.h[i].indexOf(names[j])===0)return i;return -1;}
function cell(r,i){return i<0?'':String(r[i]==null?'':r[i]).trim();}
function isoDate(s){
  var m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s); if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if(m) return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m) return m[0];
  return '';
}
function colorOf(s,i){s=key(s); if(/^#[0-9a-f]{3}([0-9a-f]{3})?$/.test(s)) return s; return COLORS[s]||SPARE[i%SPARE.length];}
function imgUrl(u){
  u=String(u||'').trim(); if(!u) return '';
  var m=/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/.exec(u);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w640';
  return /^https?:\/\//.test(u)?u:'';
}
function build(studentRows,gameRows){
  var st=[],byKey={};
  studentRows.forEach(function(s,i){var k=key(s.name); if(!k||byKey[k])return; byKey[k]={id:k,name:s.name.trim(),color:colorOf(s.color,i)}; st.push(byKey[k]);});
  var games=[];
  gameRows.forEach(function(g,i){
    var title=String(g.title||'').trim(), url=String(g.url||'').trim();
    if(!title||!url) return;
    if(!/^https?:\/\//.test(url)) url='https://'+url.replace(/^\/+/,'');
    var ak=key(g.author)||'—';
    if(!byKey[ak]){byKey[ak]={id:ak,name:String(g.author||'Без автора').trim()||'Без автора',color:SPARE[st.length%SPARE.length]};st.push(byKey[ak]);}
    var sv=key(g.status);
    games.push({id:'r'+i,row:i,title:title,author:ak,url:url,genre:g.genre||'',controls:g.controls||'',about:g.about||'',
      status:sv.indexOf('розроб')>=0?'wip':'ready',example:sv.indexOf('приклад')>=0,version:String(g.version||'').replace(/^v/i,''),date:isoDate(String(g.date||'')),img:imgUrl(g.img)});
  });
  games.sort(function(a,b){var ka=(a.date||'0000')+String(1e6+a.row),kb=(b.date||'0000')+String(1e6+b.row);return ka<kb?1:-1;});
  games.forEach(function(g,i){g.code='GD-'+String(games.length-i).padStart(3,'0');});
  return {students:st,games:games};
}
function sheetId(u){
  if(/\/d\/e\//.test(u)) return {err:'Це посилання на опубліковану версію таблиці. Скопіюй звичайне посилання з адресного рядка, коли таблиця відкрита.'};
  var m=/\/spreadsheets\/d\/([\w-]{20,})/.exec(u)||/^([\w-]{30,})$/.exec(u.trim());
  return m?{id:m[1]}:{err:'Не вдалося розпізнати посилання на Google-таблицю.'};
}
function fetchTab(id,name){
  var u='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name)+'&t='+Date.now();
  return fetch(u,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.text(); }).then(function(t){
    if(/^\s*</.test(t)) throw new Error('not csv'); return table(parseCSV(t)); });
}
/* JSONP read: a <script> tag is not subject to CORS, so this works from any host and from a file opened on the computer */
var jsonpN=0;
function jsonpTab(id,name){
  return new Promise(function(res,rej){
    var cb='__igroTab'+(++jsonpN)+'_'+Date.now(), s=document.createElement('script'), done=false;
    var timer=setTimeout(function(){ if(!done){fin();rej(new Error('timeout'));} },12000);
    function fin(){ done=true; clearTimeout(timer); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(r){
      if(done) return; fin();
      if(!r||r.status==='error'||!r.table){ rej(new Error('gviz')); return; }
      var t=r.table;
      var h=(t.cols||[]).map(function(c){return key(c&&c.label||'').replace(/[’'ʼ`]/g,'');});
      var rows=(t.rows||[]).map(function(row){return (row&&row.c||[]).map(function(c){ if(!c) return ''; return c.f!=null?String(c.f):(c.v==null?'':String(c.v)); });});
      res({h:h,rows:rows});
    };
    s.onerror=function(){ if(!done){ fin(); rej(new Error('net')); } };
    s.src='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json;responseHandler:'+cb+'&headers=1&sheet='+encodeURIComponent(name)+'&t='+Date.now();
    document.head.appendChild(s);
  });
}
function getTab(id,name){ return jsonpTab(id,name).catch(function(){ return fetchTab(id,name); }); }
function apply(d){state.students=d.students;state.games=d.games;if(loaded&&!game(loaded))eject(true);}
function load(){
  if(!SHEET_URL){ status='nosheet'; apply(build(FALLBACK.students,FALLBACK.games)); render(); return; }
  var sid=sheetId(SHEET_URL); if(sid.err){status='error';note=sid.err;apply(build(FALLBACK.students,FALLBACK.games));render();return;}
  var cached=null; try{cached=JSON.parse(localStorage.getItem('igro-sheet:'+sid.id)||'null');}catch(e){}
  if(cached&&cached.games){apply(cached);status='ok';render();}
  Promise.all([getTab(sid.id,'Ігри'),getTab(sid.id,'Учні').catch(function(){return {h:[],rows:[]};})]).then(function(res){
    var g=res[0], u=res[1];
    var gi={title:col(g,['назва']),author:col(g,['автор']),url:col(g,['посилан','url','link']),genre:col(g,['жанр']),controls:col(g,['керуван']),about:col(g,['опис']),status:col(g,['стан']),version:col(g,['версі']),date:col(g,['дата']),img:col(g,['картин','фото','зображен'])};
    if(gi.title<0||gi.url<0) throw new Error('Не знайшов аркуш «Ігри» зі стовпцями «Назва» і «Посилання».');
    var gr=g.rows.map(function(r){var o={};for(var k in gi)o[k]=cell(r,gi[k]);return o;});
    var ui={name:col(u,['імя','ім','name']),color:col(u,['колір','color'])};
    var ur=(ui.name>=0&&col(u,['назва'])<0)?u.rows.map(function(r){return {name:cell(r,ui.name),color:cell(r,ui.color)};}):[];
    var d=build(ur,gr); apply(d); status='ok'; note='';
    try{localStorage.setItem('igro-sheet:'+sid.id,JSON.stringify(d));}catch(e){}
    render(); if(pendingDrop){pendingDrop=false;dropIn();}
  }).catch(function(err){
    status=cached?'ok':'error';
    note=(err&&err.message&&/[а-яі]/i.test(err.message))?err.message:'Не вдалося завантажити таблицю. Якщо сайт відкрито в перегляді всередині Claude, відкрий його у звичайному браузері або з хостингу: у перегляді доступ до Google закритий. Інакше перевір інтернет і доступ до таблиці: «Усі, хто має посилання» → «Читач».';
    if(!cached) apply({students:[],games:[]});
    render();
  });
}

/* ---------- sound ---------- */
var AC=null, muted=false;
try{muted=localStorage.getItem('igro-mute')==='1';}catch(e){}
function tone(seq){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime+0.02;
    seq.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.045,t+n[1]);g.gain.exponentialRampToValueAtTime(0.0001,t+n[1]+n[2]);
      o.connect(g);g.connect(AC.destination);o.start(t+n[1]);o.stop(t+n[1]+n[2]+0.03);});
  }catch(e){}
}
var CLUNK=[[160,0,.05],[80,.05,.09]], JINGLE=[[523,0,.09],[659,.1,.09],[784,.2,.09],[1047,.3,.3]], EJECT=[[300,0,.05],[600,.06,.06]];

/* ---------- page ---------- */
function coverHTML(g,s){
  var attrs=' data-seed="'+esc(g.id+g.title)+'" data-c="'+esc(s.color)+'"';
  return g.img?'<img class="cov" src="'+esc(g.img)+'" alt="" referrerpolicy="no-referrer"'+attrs+'>':'<canvas width="64" height="36"'+attrs+'></canvas>';
}
/* a picture link that does not open falls back to the pixel cover */
document.addEventListener('error',function(e){
  var im=e.target; if(!im||im.tagName!=='IMG'||!im.classList.contains('cov')) return;
  var c=document.createElement('canvas'); c.width=64; c.height=36;
  if(im.dataset.seed){c.dataset.seed=im.dataset.seed;c.dataset.c=im.dataset.c;drawCover(c,im.dataset.seed,im.dataset.c);}
  else{var g=loaded&&game(loaded); if(g) drawCover(c,g.id+g.title,stu(g.author).color);}
  im.replaceWith(c);
},true);
function cartHTML(g){
  var s=stu(g.author);
  var t='<div class="cart'+(loaded===g.id?' out':'')+'" style="--c:'+esc(s.color)+'" data-id="'+esc(g.id)+'" tabindex="'+(loaded===g.id?'-1':'0')+'" role="button" aria-label="'+esc(g.title)+', автор '+esc(s.name)+'. Вставити в приставку">';
  t+='<div class="shell"></div><div class="ribs"></div><div class="grip l"></div><div class="grip r"></div>';
  t+='<div class="sticker"><div class="band"><span>8 BIT</span><span>'+esc(g.code)+'</span></div>'+coverHTML(g,s);
  t+='<div><div class="ttl">'+esc(g.title)+'</div><div class="who"><i></i>'+esc(s.name)+'</div></div></div>';
  if(g.example) t+='<span class="tagx">приклад</span>'; else if(g.status==='wip') t+='<span class="tagx wip">в розробці</span>';
  t+='</div>';
  return t;
}
function redraw(){app.querySelectorAll('canvas[data-seed]').forEach(function(c){drawCover(c,c.dataset.seed,c.dataset.c);});}

function render(){
  var games=state.games;
  var shown=filter==='all'?games:games.filter(function(g){return g.author===filter;});
  var touch=window.matchMedia&&matchMedia('(hover: none)').matches;
  var h='';
  if(status==='nosheet') h+='<div class="notice">Таблицю ще не підключено, тому на полиці касети-приклади. Встав посилання на Google-таблицю у файл сайту (рядок <code>SHEET_URL</code>).</div>';
  else if(note) h+='<div class="notice">'+esc(note)+'</div>';
  h+='<header class="top"><div class="eyebrow"><span class="tag">GDevelop 5</span><span>'+esc(state.group.sub)+'</span></div>';
  h+='<h1>'+esc(state.group.name)+'</h1>';
  h+='<p class="lead">Ігри, які зробили учні нашої групи. '+(touch?'<b>Натисни на касету</b>, і вона зайде в приставку. Можна й перетягнути: затисни касету і веди вниз.':'<b>Перетягни касету в приставку внизу</b> або просто натисни на неї, і гра запуститься.')+'</p>';
  if(status!=='loading') h+='<div class="stats"><span><b>'+state.students.length+'</b> '+plural(state.students.length,'розробник','розробники','розробників')+'</span><span><b>'+games.length+'</b> '+plural(games.length,'касета','касети','касет')+'</span>'+(games[0]&&games[0].date?'<span>нова: <b>'+esc(fmtDate(games[0].date))+'</b></span>':'')+'</div>';
  h+='</header>';

  h+='<section aria-label="Касети" style="display:grid;gap:22px">';
  if(state.students.length){
    h+='<div class="roster" role="group" aria-label="Фільтр за автором"><button class="chip" data-f="all" aria-pressed="'+(filter==='all')+'">Усі <span class="n">'+games.length+'</span></button>';
    state.students.forEach(function(s){
      var n=games.filter(function(g){return g.author===s.id;}).length;
      h+='<button class="chip" style="--c:'+esc(s.color)+'" data-f="'+esc(s.id)+'" aria-pressed="'+(filter===s.id)+'"><span class="sw"></span>'+esc(s.name)+' <span class="n">'+n+'</span></button>';
    });
    h+='</div>';
  }
  if(status==='loading'&&!games.length) h+='<div class="empty">Завантажую касети…</div>';
  else if(!shown.length) h+='<div class="empty">'+(filter==='all'?'Полиця поки порожня. Касети з’являться, щойно в таблиці будуть ігри.':'У цього автора ще немає касет. Скоро будуть.')+'</div>';
  else{
    h+='<div class="shelf">';
    shown.forEach(function(g){
      h+='<div class="cell">'+cartHTML(g)+'<div class="meta">'+[g.genre,g.version?'v'+g.version:'',fmtDate(g.date)].filter(Boolean).map(esc).join(' · ')+'</div></div>';
    });
    h+='</div>';
  }
  h+='</section>';
  h+='<footer>'+esc(state.group.sub)+'</footer>';
  app.innerHTML='<div class="wrap">'+h+'</div>';
  redraw();
}

app.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.f){filter=b.dataset.f;render();return;}
});

/* ---------- console + TV ---------- */
var deck=document.createElement('div');
deck.innerHTML=
 '<div class="dock"><div class="console" id="console" aria-label="Приставка">'+
   '<div class="hint" id="hint">Встав касету</div>'+
   '<div class="deckTop"><span class="led" id="led"></span><div class="slot" id="slot"><div class="incart" id="incart" hidden><span id="inlabel"></span></div></div><div class="ports"><i></i><i></i></div></div>'+
   '<div class="face"><div class="brand">GD-8<small>8 BIT · TV GAME</small></div><div class="stripe"></div>'+
   '<div class="cbtns"><button class="cbtn" id="pwr"><b></b>POWER</button><button class="cbtn" id="rst"><b></b>RESET</button><button class="cbtn" id="ej"><b></b>EJECT</button><button class="cbtn" id="snd"><b></b><span id="sndl"></span></button></div></div>'+
 '</div></div>'+
 '<div class="tv-wrap" id="tv" hidden role="dialog" aria-modal="true" aria-labelledby="tv-title"><div class="tv">'+
   '<div class="screen"><canvas class="noise" id="noise" width="128" height="72" hidden></canvas><div class="osd" id="osd"></div></div>'+
   '<div class="tvbase"><span class="mk">ТЕЛЕВІЗОР</span><div><button class="ghost" id="tvoff">Вимкнути екран</button><button class="ghost" id="tvej">Вийняти касету</button></div></div>'+
 '</div></div>';
document.body.appendChild(deck);
var $=function(id){return document.getElementById(id);};
var consoleEl=$('console'), slot=$('slot'), incart=$('incart'), hint=$('hint'), tv=$('tv'), osd=$('osd'), led=$('led');
function sndLabel(){$('sndl').textContent=muted?'ЗВУК: НІ':'ЗВУК';}
sndLabel();

function cssq(s){return String(s).replace(/["\\]/g,'\\$&');}
function insert(id, from){
  var g=game(id); if(!g) return;
  if(loaded&&loaded!==id) eject(true);
  var target=slot.getBoundingClientRect();
  var gh=from||makeGhost(app.querySelector('.cart[data-id="'+cssq(id)+'"]'));
  if(!gh){seat(g);return;}
  var w=gh.offsetWidth||200, sc=170/w;
  var tx=target.left+target.width/2-85, ty=target.top-70+8;
  if(reduced){gh.remove();seat(g);return;}
  requestAnimationFrame(function(){
    gh.classList.add('flying');
    gh.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
    setTimeout(function(){gh.remove();seat(g);},380);
  });
}
function seat(g){
  var s=stu(g.author);
  loaded=g.id;
  incart.style.setProperty('--c',s.color);
  $('inlabel').textContent=g.title;
  incart.hidden=false; incart.classList.remove('up');
  hint.hidden=true; led.classList.add('on');
  tone(CLUNK);
  if(navigator.vibrate) try{navigator.vibrate([25,40,25]);}catch(e){}
  render();
  setTimeout(function(){openTV(true);},reduced?0:260);
}
function eject(quiet){
  if(!loaded) return;
  closeTV();
  var done=function(){incart.hidden=true;incart.classList.remove('up');};
  if(quiet||reduced){done();}else{incart.classList.add('up');tone(EJECT);setTimeout(done,330);}
  loaded=null; led.classList.remove('on'); hint.hidden=false;
  if(!quiet) render();
}
var bootRaf=0;
function openTV(boot){
  var g=loaded&&game(loaded); if(!g) return;
  var s=stu(g.author);
  var keys=String(g.controls||'').split(',').map(function(k){return k.trim();}).filter(Boolean);
  osd.innerHTML=(g.img?'<img class="cov" src="'+esc(g.img)+'" alt="" referrerpolicy="no-referrer">':'<canvas width="64" height="36" id="tvc"></canvas>')+
    '<h3 id="tv-title">'+esc(g.title)+'</h3>'+
    '<div class="by">АВТОР: '+esc(s.name.toUpperCase())+(g.version?' · V'+esc(g.version):'')+'</div>'+
    (g.about?'<p class="about">'+esc(g.about)+'</p>':'')+
    (keys.length?'<div class="keys">Керування: '+keys.map(function(k){return '<kbd>'+esc(k)+'</kbd>';}).join('')+'</div>':'')+
    '<a class="btn start" id="go" href="'+esc(g.url)+'" target="_blank" rel="noopener">▶ ГРАТИ</a>'+
    '<p class="note">'+(g.example?'Це касета-приклад: кнопка відкриє головну сторінку gd.games.':'Гра відкриється в новій вкладці на gd.games.')+'</p>';
  if(!g.img) drawCover($('tvc'),g.id+g.title,s.color);
  tv.hidden=false;
  if(boot&&!reduced) runNoise(); else $('noise').hidden=true;
  setTimeout(function(){try{$('go').focus({preventScroll:true});}catch(e){}},boot&&!reduced?700:30);
}
function closeTV(){tv.hidden=true;cancelAnimationFrame(bootRaf);}
function runNoise(){
  var n=$('noise'),ctx=n.getContext('2d'),img=ctx.createImageData(128,72),t0=performance.now();
  n.hidden=false;cancelAnimationFrame(bootRaf);
  (function f(now){
    for(var i=0;i<img.data.length;i+=4){var v=Math.random()*230|0;img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v+20;img.data[i+3]=255;}
    ctx.putImageData(img,0,0);
    if(now-t0<650) bootRaf=requestAnimationFrame(f); else {n.hidden=true;tone(JINGLE);}
  })(t0);
}
function nudge(){ hint.hidden=false; hint.style.animation='none'; void hint.offsetWidth; hint.style.animation=''; tone([[120,0,.08]]); }
$('pwr').addEventListener('click',function(){ if(loaded) openTV(false); else nudge(); });
$('rst').addEventListener('click',function(){ if(loaded) openTV(true); else nudge(); });
$('ej').addEventListener('click',function(){ eject(false); });
$('snd').addEventListener('click',function(){ muted=!muted; try{localStorage.setItem('igro-mute',muted?'1':'0');}catch(e){} sndLabel(); if(!muted) tone([[880,0,.06]]); });
$('tvoff').addEventListener('click',closeTV);
$('tvej').addEventListener('click',function(){eject(false);});
tv.addEventListener('click',function(e){ if(e.target===tv) closeTV(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!tv.hidden) closeTV(); });

/* ---------- drag & drop (mouse, pen, touch long-press) ---------- */
function makeGhost(cart, x, y){
  if(!cart) return null;
  var r=cart.getBoundingClientRect();
  var gh=document.createElement('div'); gh.className='ghostcart';
  gh.style.width=r.width+'px';
  var clone=cart.cloneNode(true); clone.classList.remove('lifted','out');
  gh.appendChild(clone); document.body.appendChild(gh);
  var cv=clone.querySelector('canvas'); if(cv) drawCover(cv,cv.dataset.seed,cv.dataset.c);
  gh._ox = x==null ? 0 : x-r.left; gh._oy = y==null ? 0 : y-r.top;
  gh.style.transform='translate('+r.left+'px,'+r.top+'px)';
  return gh;
}
var drag=null;
function overConsole(x,y){var r=consoleEl.getBoundingClientRect();return x>r.left-40&&x<r.right+40&&y>r.top-90&&y<r.bottom+20;}
app.addEventListener('pointerdown',function(e){
  var c=e.target.closest('.cart'); if(!c||e.target.closest('button')||e.button>0||c.classList.contains('out')) return;
  drag={el:c,id:c.dataset.id,x:e.clientX,y:e.clientY,on:false,pid:e.pointerId,touch:e.pointerType==='touch',t:0,gh:null};
  if(!drag.touch) e.preventDefault();
  if(drag.touch) drag.t=setTimeout(function(){ if(drag&&!drag.on) start(drag.x,drag.y); },260);
});
function start(x,y){
  drag.on=true; drag.gh=makeGhost(drag.el,x,y); drag.el.classList.add('lifted');
  if(navigator.vibrate) try{navigator.vibrate(15);}catch(e){}
  move(x,y);
}
function move(x,y){
  var gh=drag.gh; gh.style.transform='translate('+(x-gh._ox)+'px,'+(y-gh._oy)+'px) rotate(-4deg) scale(1.04)';
  consoleEl.classList.toggle('hot',overConsole(x,y));
}
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7) return;
    if(drag.touch){clearTimeout(drag.t);drag=null;return;}
    start(e.clientX,e.clientY);
  }
  move(e.clientX,e.clientY);
});
document.addEventListener('touchmove',function(e){ if(drag&&drag.on) e.preventDefault(); },{passive:false});
function finish(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.pid)) return;
  var d=drag; drag=null; clearTimeout(d.t);
  var hot=consoleEl.classList.contains('hot'); consoleEl.classList.remove('hot');
  if(!d.on){ if(!cancel) insert(d.id); return; }
  d.el.classList.remove('lifted');
  if(hot&&!cancel){ insert(d.id,d.gh); return; }
  var r=d.el.getBoundingClientRect(), gh=d.gh;
  gh.classList.add('flying'); gh.style.transform='translate('+r.left+'px,'+r.top+'px)';
  setTimeout(function(){gh.remove();},reduced?0:380);
}
document.addEventListener('pointerup',function(e){finish(e,false);});
document.addEventListener('pointercancel',function(e){finish(e,true);});
/* rotating the phone or resizing mid-drag cancels the drag cleanly */
function cancelDrag(){ if(drag){ var d=drag; drag=null; clearTimeout(d.t); consoleEl.classList.remove('hot'); if(d.gh) d.gh.remove(); d.el.classList.remove('lifted'); } }
var lastW=innerWidth;
window.addEventListener('resize',function(){ if(Math.abs(innerWidth-lastW)>40){ lastW=innerWidth; cancelDrag(); } });
window.addEventListener('orientationchange',cancelDrag);
window.addEventListener('blur',cancelDrag);
document.addEventListener('visibilitychange',function(){ if(document.hidden){ cancelDrag(); if(AC&&AC.state==='running') try{AC.suspend();}catch(e){} } else if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } });
var lastTouch=null; try{lastTouch=matchMedia('(hover: none)').matches;}catch(e){}
window.addEventListener('resize',function(){ var t=false; try{t=matchMedia('(hover: none)').matches;}catch(e){} if(t!==lastTouch){lastTouch=t;render();} });
app.addEventListener('contextmenu',function(e){ if(e.target.closest('.cart')) e.preventDefault(); });
app.addEventListener('keydown',function(e){
  var c=e.target.closest&&e.target.closest('.cart');
  if(c&&e.target===c&&(e.key==='Enter'||e.key===' ')&&!c.classList.contains('out')){e.preventDefault();insert(c.dataset.id);}
});

/* ---------- pixel cover art seeded from the title ---------- */
function rng(seed){var h=1779033703^seed.length;for(var i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296;};}
function drawCover(cv,seed,c){
  if(!cv) return;
  var x=cv.getContext('2d'), r=rng(seed||'x'), W=64, H=36;
  var skies=[['#2B1E5C','#E86A7A'],['#7EC8F2','#D9F1FF'],['#0E1B3D','#2D4C8C'],['#F7B267','#F4845F'],['#1F5E5B','#9AD7C9']];
  var sk=skies[Math.floor(r()*skies.length)], g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sk[0]);g.addColorStop(1,sk[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.75)';for(var i=0;i<7;i++)x.fillRect(Math.floor(r()*W),Math.floor(r()*14),1,1);
  x.fillStyle='rgba(0,0,0,.18)';var hy=22;for(var px=0;px<W;px++){hy+=Math.round(r()*2-1);hy=Math.max(16,Math.min(26,hy));x.fillRect(px,hy,1,H-hy);}
  var gy=29;x.fillStyle='#3A2A1E';x.fillRect(0,gy,W,H-gy);x.fillStyle='#4CB050';x.fillRect(0,gy,W,2);
  x.fillStyle='rgba(0,0,0,.25)';for(var t=0;t<W;t+=4)x.fillRect(t,gy+3,2,1);
  var plats=2+Math.floor(r()*2);for(var p=0;p<plats;p++){var pw=8+Math.floor(r()*8),pxx=6+Math.floor(r()*(W-pw-6)),py=12+Math.floor(r()*11);
    x.fillStyle='#7A5634';x.fillRect(pxx,py,pw,3);x.fillStyle='#E6C17A';x.fillRect(pxx,py,pw,1);
    x.fillStyle='#FFD23F';if(r()>.3){x.fillRect(pxx+2,py-4,2,2);x.fillRect(pxx+6,py-4,2,2);}}
  var ex=36+Math.floor(r()*20);x.fillStyle='#2A1B2E';x.fillRect(ex,gy-4,5,4);x.fillStyle='#fff';x.fillRect(ex+1,gy-3,1,1);x.fillRect(ex+3,gy-3,1,1);
  var hx=8+Math.floor(r()*14);x.fillStyle='#16213A';x.fillRect(hx-1,gy-8,7,8);x.fillStyle=c||'#E2392F';x.fillRect(hx,gy-7,5,6);x.fillStyle='#fff';x.fillRect(hx+3,gy-6,1,2);
}

/* ---------- intro ---------- */
var pendingDrop=false;
function dropIn(){
  var dock=deck.querySelector('.dock'); dock.classList.add('rise');
  var sh=app.querySelector('.shelf');
  if(!sh){pendingDrop=true;}
  if(sh){ sh.classList.add('dropin'); sh.querySelectorAll('.cell').forEach(function(c,i){c.style.setProperty('--i',i);}); }
  setTimeout(function(){ dock.classList.remove('rise'); var s2=app.querySelector('.shelf'); if(s2) s2.classList.remove('dropin'); },2400);
}
function intro(){
  var seen=false; try{seen=sessionStorage.getItem('igro-intro')==='1';}catch(e){}
  if(reduced||seen){ return; }
  try{sessionStorage.setItem('igro-intro','1');}catch(e){}
  var ov=document.createElement('div'); ov.className='intro'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Заставка');
  var k=0;
  var logo=state.group.name.split(/\s+/).map(function(w){
    return '<span class="w">'+Array.from(w).map(function(ch){return '<span class="ch" style="animation-delay:'+(0.6+0.06*(k++)).toFixed(2)+'s">'+esc(ch)+'</span>';}).join('')+'</span>';
  }).join(' ');
  ov.innerHTML='<div class="crt"></div><div class="splash"><div class="bl">GD-8 · 8 BIT · TV GAME</div><h2 class="logo">'+logo+'</h2>'+
    '<canvas id="run" width="160" height="40"></canvas><p class="press">▶ НАТИСНИ, ЩОБ ПОЧАТИ</p><p class="copy">© '+new Date().getFullYear()+' '+esc((state.group.sub.split('·').pop()||'').trim().toUpperCase())+'</p></div>'+
    '<button class="skip" type="button">Пропустити</button>';
  document.body.appendChild(ov);
  document.documentElement.style.overflow='hidden';
  var raf=0, gone=false;
  var cv=ov.querySelector('#run'), x=cv.getContext('2d');
  function cols(){var c=state.students.map(function(s){return s.color;});return c.length?c:SPARE;}
  var coins=[]; for(var i=0;i<9;i++) coins.push({x:22+i*15,y:i%3===1?14:20,got:0});
  var t0=performance.now()+1250, score=0;
  function frame(now){
    var t=Math.max(0,now-t0), px=Math.min(170,-10+t*0.11), W=160,H=40, cl=cols();
    x.clearRect(0,0,W,H);
    x.fillStyle='#3A2A1E'; x.fillRect(0,32,W,8); x.fillStyle='#4CB050'; x.fillRect(0,32,W,2);
    x.fillStyle='rgba(0,0,0,.25)'; for(var g=0;g<W;g+=4) x.fillRect(g,35,2,1);
    coins.forEach(function(c){
      if(!c.got&&px+6>c.x){c.got=now;score++;if(!muted&&AC)tone([[988,0,.04],[1319,.04,.06]]);}
      if(!c.got){ var w=(Math.floor(now/140)+c.x)%4<2?3:2; x.fillStyle='#FFD23F'; x.fillRect(c.x+(3-w)/2,c.y,w,4); x.fillStyle='#FFF3B0'; x.fillRect(c.x+1,c.y,1,1);}
      else if(now-c.got<300){ x.fillStyle='#FFF3B0'; var u=(now-c.got)/30|0; x.fillRect(c.x,c.y-u,1,1); x.fillRect(c.x+2,c.y-u-1,1,1);}
    });
    var jump=(Math.floor(px)%30>18&&Math.floor(px)%30<26)?-5:0, leg=Math.floor(now/90)%2, col=cl[Math.floor(Math.max(0,px)/45)%cl.length];
    var sx=Math.round(px), sy=24+jump;
    x.fillStyle='#16133A'; x.fillRect(sx-1,sy-1,8,9);
    x.fillStyle=col; x.fillRect(sx,sy,6,6);
    x.fillStyle='#fff'; x.fillRect(sx+4,sy+1,1,2);
    x.fillStyle='#16133A'; x.fillRect(sx+(leg?0:1),sy+6,2,2); x.fillRect(sx+(leg?4:3),sy+6,2,2);
    x.fillStyle='#F4EEDF'; x.font='6px monospace'; x.fillText('★ '+score,W-24,8);
    if(!gone) raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  var auto=setTimeout(function(){bye(false);},4600);
  function bye(user){
    if(gone) return; gone=true; clearTimeout(auto);
    if(user) tone(JINGLE);
    ov.classList.add('bye');
    setTimeout(function(){cancelAnimationFrame(raf);ov.remove();document.documentElement.style.overflow='';document.removeEventListener('keydown',onKey);},520);
    setTimeout(dropIn,180);
  }
  function onKey(){bye(true);}
  ov.addEventListener('click',function(){bye(true);});
  document.addEventListener('keydown',onKey);
}

render();
intro();
load();
})();
